<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudMail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c1222 0%, #151030 35%, #1a0a2e 65%, #0f172a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 12px 48px rgba(99, 102, 241, 0.45);
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .wordmark {
      margin-top: 20px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #e2e8f0;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.25s forwards;
    }

    .wordmark .ai { color: #818cf8; }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 28px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #818cf8;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <img class="logo" src="/icon.png" alt="CloudMail" />
  <div class="wordmark">CloudM<span class="ai">ai</span>l</div>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
